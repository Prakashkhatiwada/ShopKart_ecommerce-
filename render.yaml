databases:
  - name: shopkart-db
    databaseName: ecommerce
    user: ecommerce
    plan: free

services:
  - type: web
    name: shopkart
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn ecommerce.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DJANGO_SETTINGS_MODULE
        value: ecommerce.settings
      - key: DATABASE_URL
        fromDatabase:
          name: shopkart-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
